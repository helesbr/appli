# Vérifie le site chaque heure. En cas d'échec, GitHub envoie un e-mail au propriétaire du dépôt.
name: Surveillance du site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Contrôler /api/health
        run: curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 https://moggtrack.vercel.app/api/health
